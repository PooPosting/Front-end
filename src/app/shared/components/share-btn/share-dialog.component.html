<div class="w-96 overflow-hidden p-5 flex items-center flex-col bg-surface-400">
    <div class="w-full flex">
        <span class="w-full text-center text-2xl pb-3">Share</span>
        <button class="m-0 icon-cancel text-2xl absolute right-3" (click)="closeDialog()"></button>
    </div>
    <div class="w-full pb-3 flex items-center flex-row select-none overflow-auto no-scrollbar" (scroll)="onScroll($event)" #scrollCont>
        <div class="flex flex-col cursor-pointer p-2 m-1 rounded-lg hover:bg-surface-500 btn" (click)="closeDialog('Telegram')">
            <div class="flex justify-center icon-telegram text-5xl text-blue-400 pb-2"></div>
            <span class="text-center">Telegram</span>
        </div>
        <div class="flex flex-col cursor-pointer p-2 m-1 rounded-lg hover:bg-surface-500 btn" (click)="closeDialog('Twitter')">
            <div class="flex justify-center icon-twitter text-5xl text-gray-600 pb-2"></div>
            <span class="text-center">Twitter/X</span>
        </div>
        <div class="flex flex-col cursor-pointer p-2 m-1 rounded-lg hover:bg-surface-500 btn" (click)="closeDialog('Facebook')">
            <div class="flex justify-center icon-facebook text-5xl text-blue-600 pb-2"></div>
            <span class="text-center">Facebook</span>
        </div>
        <div class="flex flex-col cursor-pointer p-2 m-1 rounded-lg hover:bg-surface-500 btn" (click)="closeDialog('Mail')">
            <div class="flex justify-center icon-mail-alt text-5xl text-red-500 pb-2"></div>
            <span class="text-center">E-mail</span>
        </div>
        <div class="flex flex-col cursor-pointer p-2 m-1 rounded-lg hover:bg-surface-500 btn" (click)="closeDialog('Copy')">
            <div class="flex justify-center icon-link text-5xl text-gray-400 pb-2"></div>
            <span class="text-center">Copy</span>
        </div>
        <div 
            class="w-8 h-8 absolute right-1 top-[42%] rounded-full bg-dark p-3 flex justify-center items-center cursor-pointer" 
            (click)="scrollCont.scrollBy({ left: 273, behavior: 'smooth' })"
            [ngClass]="scrollLeft >= scrollCont.scrollWidth - scrollCont.clientWidth - 10 ? 'invisible' : 'visible'"
            >
            <div class="icon-angle-right text-xl text-surface-600"></div>
        </div>
        <div 
            class="w-8 h-8 absolute left-1 top-[42%] rounded-full bg-dark p-3 flex justify-center items-center cursor-pointer" 
            (click)="scrollCont.scrollBy({ left: -273, behavior: 'smooth' })"
             *ngIf="scrollLeft >= 10"
            >
            <div class="icon-angle-left text-xl text-surface-600"></div>
        </div>
    </div>
</div>
